# Demo fixtures contain deliberately fake credentials so that parsers can be tested
# (see demo/fixtures/trivy and demo/fixtures/gitleaks).
#
# They are shaped like real secrets because the parsers must recognise real shapes,
# which is exactly what push protection flags. The values are not credentials: they
# contain "FAKE" / "EXAMPLE" markers and no provider can resolve them.
#
# Real secrets must never be committed, including inside fixtures.
paths-ignore:
  - "demo/fixtures/**"
