title: Multiple Failed SSH Authentication Attempts
id: c6b21e0f-3d95-4f27-8a51-7c0e9b2d1a88
status: test
description: Detects repeated failed SSH logins from the same host, including invalid users.
references:
  - https://attack.mitre.org/techniques/T1110/
author: P4B lab
date: 2026/11/12
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  product: linux
  service: sshd
detection:
  selection_failed:
    message|contains: 'Failed password'
  selection_invalid:
    message|contains: 'Invalid user'
  condition: 1 of selection_*
falsepositives:
  - Users mistyping their password
level: medium
