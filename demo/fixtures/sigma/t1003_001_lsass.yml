title: LSASS Memory Dump via comsvcs.dll
id: 0f8b1e42-7c3a-4d59-9a2e-1b6c5d4e3f21
status: test
description: Detects rundll32 loading comsvcs.dll to dump LSASS process memory.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: P4B lab
date: 2026/11/12
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith: '\rundll32.exe'
    - OriginalFileName: 'rundll32.exe'
  selection_command:
    CommandLine|contains|all:
      - 'comsvcs'
      - 'MiniDump'
  condition: selection_image and selection_command
falsepositives:
  - Legitimate backup or diagnostic tooling
level: high
