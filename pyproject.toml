[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "p4b"
version = "0.1.0"
description = "Detection engineering workbench: normalize 10 OSS security tools, join on ATT&CK, prove coverage with Atomic Red Team."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pr0j3ct_N4m3_b1g" }]
keywords = ["security", "detection-engineering", "mitre-attack", "sigma", "purple-team"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = [
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "PyYAML>=6,<7",
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
p4b = "p4b.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/p4b"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
